/* Bulk check control used in top-level sections and subsection/phase headers */

  display:inline-flex;
  align-items:center;
  gap:7px;

  padding:6px 9px;

}

  appearance:none;
  -webkit-appearance:none;
  width:19px;
  height:19px;

  border-radius:5px;

}

&lt;script id=&quot;image-lightbox-script-v5&quot;&gt;
(function(){
  function initImageLightbox(){
    if(document.getElementById(&#x27;imageLightbox&#x27;)) return;

    const wrap = document.createElement(&#x27;div&#x27;);
    wrap.innerHTML = `
&lt;div id=&quot;imageLightbox&quot; class=&quot;image-lightbox&quot; aria-hidden=&quot;true&quot;&gt;
  &lt;button id=&quot;imageLightboxClose&quot; class=&quot;image-lightbox-close&quot; type=&quot;button&quot; aria-label=&quot;Close enlarged image&quot;&gt;×&lt;/button&gt;
  &lt;div class=&quot;image-lightbox-inner&quot;&gt;
    &lt;img id=&quot;imageLightboxImg&quot; class=&quot;image-lightbox-img&quot; alt=&quot;Expanded guide image&quot;&gt;
  &lt;/div&gt;
  &lt;div class=&quot;image-lightbox-hint&quot;&gt;Click image/background or press Esc to close&lt;/div&gt;
&lt;/div&gt;
`;
    const lightbox = wrap.firstElementChild;
    document.body.appendChild(lightbox);

    const big = document.getElementById(&#x27;imageLightboxImg&#x27;);
    const close = document.getElementById(&#x27;imageLightboxClose&#x27;);

    function openLightbox(img){
      const src = img.currentSrc || img.src || img.dataset.remote;
      if(!src) return;
      big.src = src;

      lightbox.setAttribute(&#x27;aria-hidden&#x27;,&#x27;false&#x27;);
      document.body.classList.add(&#x27;lightbox-open&#x27;);
    }

    function closeLightbox(){
      lightbox.classList.remove(&#x27;open&#x27;);
      lightbox.setAttribute(&#x27;aria-hidden&#x27;,&#x27;true&#x27;);

&lt;script id=&quot;bulk-check-zebra-script-v6&quot;&gt;
(function(){
  function stopSummaryToggle(el){
    [&#x27;click&#x27;,&#x27;mousedown&#x27;,&#x27;pointerdown&#x27;,&#x27;touchstart&#x27;].forEach(function(evt){
      el.addEventListener(evt,function(e){ e.stopPropagation(); }, {passive:false});
    });
  }

  function makeBulkControl(kind){
    const label=document.createElement(&#x27;label&#x27;);
    label.className=&#x27;bulk-check-wrap&#x27;;
    label.title=kind===&#x27;section&#x27; ? &#x27;Mark every step in this entire section&#x27; : &#x27;Mark every step in this phase / subsection&#x27;;

    const cb=document.createElement(&#x27;input&#x27;);
    cb.type=&#x27;checkbox&#x27;;
    cb.className=&#x27;bulk-check&#x27;;
    cb.setAttribute(&#x27;aria-label&#x27;, kind===&#x27;section&#x27; ? &#x27;Mark entire section complete&#x27; : &#x27;Mark entire phase complete&#x27;);

    const text=document.createElement(&#x27;span&#x27;);
    text.className=&#x27;bulk-label-text&#x27;;
    text.textContent=kind===&#x27;section&#x27; ? &#x27;Section&#x27; : &#x27;Phase&#x27;;

    label.appendChild(cb);
    label.appendChild(text);
    stopSummaryToggle(label);
    return {label,cb};
  }

  function childStepBoxes(container){
    return Array.from(container.querySelectorAll(&#x27;.cb&#x27;));
  }

  function syncOne(control, boxes){
    const total=boxes.length;
    const checked=boxes.filter(x=&gt;x.checked).length;

    control.checked = total&gt;0 &amp;&amp; checked===total;
    control.indeterminate = checked&gt;0 &amp;&amp; checked&lt;total;

    const wrap=control.closest(&#x27;.bulk-check-wrap&#x27;);
    if(wrap){
      wrap.classList.toggle(&#x27;complete&#x27;, total&gt;0 &amp;&amp; checked===total);
      wrap.classList.toggle(&#x27;partial&#x27;, checked&gt;0 &amp;&amp; checked&lt;total);
    }
  }

  function syncBulkChecks(){
    document.querySelectorAll(&#x27;details.group&#x27;).forEach(function(group){
      const cb=group.querySelector(&#x27;:scope &gt; summary .bulk-check&#x27;);
      if(cb) syncOne(cb, childStepBoxes(group));
    });

    document.querySelectorAll(&#x27;details.section, details.big-section&#x27;).forEach(function(section){
      const cb=section.querySelector(&#x27;:scope &gt; summary .bulk-check&#x27;);
      if(cb) syncOne(cb, childStepBoxes(section));
    });
  }

  function persistAfterBulk(boxes){
    if(!boxes.length) return;
    // Existing guide listeners save ALL step states whenever one normal step checkbox changes.
    boxes[0].dispatchEvent(new Event(&#x27;change&#x27;,{bubbles:true}));
    setTimeout(syncBulkChecks,0);
  }

  function initBulkChecks(){
    if(document.documentElement.dataset.bulkChecksV6===&#x27;1&#x27;){
      syncBulkChecks();
      return;
    }
    document.documentElement.dataset.bulkChecksV6=&#x27;1&#x27;;

    /* Subsections / phases */
    document.querySelectorAll(&#x27;details.group&#x27;).forEach(function(group){
      const summary=group.querySelector(&#x27;:scope &gt; summary&#x27;);
      if(!summary || summary.querySelector(&#x27;.bulk-check-wrap&#x27;)) return;

      const made=makeBulkControl(&#x27;phase&#x27;);
      const chevron=summary.querySelector(&#x27;.chev&#x27;);

      const right=document.createElement(&#x27;div&#x27;);
      right.className=&#x27;bulk-right&#x27;;
      right.appendChild(made.label);
      if(chevron){
        chevron.parentNode.removeChild(chevron);
        right.appendChild(chevron);
      }
      summary.appendChild(right);

      made.cb.addEventListener(&#x27;change&#x27;,function(e){
        e.stopPropagation();
        const boxes=childStepBoxes(group);
        boxes.forEach(function(box){ box.checked=made.cb.checked; });
        persistAfterBulk(boxes);
      });
    });

    /* Top-level sections */
    document.querySelectorAll(&#x27;details.section, details.big-section&#x27;).forEach(function(section){
      const summary=section.querySelector(&#x27;:scope &gt; summary&#x27;);
      if(!summary || summary.querySelector(&#x27;.bulk-check-wrap&#x27;)) return;

      const made=makeBulkControl(&#x27;section&#x27;);

      // Der Eisendrache already has a right-side wrapper containing count + chevron.
      let existingRight=null;
      Array.from(summary.children).forEach(function(child){
        if(child.querySelector &amp;&amp; (child.querySelector(&#x27;.section-count&#x27;) || child.querySelector(&#x27;.chev&#x27;))){
          if(child !== summary.firstElementChild) existingRight=child;
        }
      });

      if(existingRight){
        existingRight.classList.add(&#x27;bulk-right&#x27;);
        existingRight.insertBefore(made.label, existingRight.firstChild);
      } else {
        const chevron=summary.querySelector(&#x27;:scope &gt; .chev&#x27;);
        const right=document.createElement(&#x27;div&#x27;);
        right.className=&#x27;bulk-right&#x27;;
        right.appendChild(made.label);
        if(chevron){
          chevron.parentNode.removeChild(chevron);
          right.appendChild(chevron);
        }
        summary.appendChild(right);
      }

      made.cb.addEventListener(&#x27;change&#x27;,function(e){
        e.stopPropagation();
        const boxes=childStepBoxes(section);
        boxes.forEach(function(box){ box.checked=made.cb.checked; });
        persistAfterBulk(boxes);
      });
    });

    document.addEventListener(&#x27;change&#x27;,function(e){
      if(e.target &amp;&amp; e.target.classList &amp;&amp; e.target.classList.contains(&#x27;cb&#x27;)){
        setTimeout(syncBulkChecks,0);
      }
    });

    syncBulkChecks();
  }

  if(document.readyState===&#x27;loading&#x27;){
    document.addEventListener(&#x27;DOMContentLoaded&#x27;,initBulkChecks);
  }else{
    initBulkChecks();
  }

  // Existing guide render functions finish synchronously, but this second pass makes the
  // enhancement resilient if a browser delays inline script execution.
  setTimeout(initBulkChecks,50);
})();

&lt;style id=&quot;high-contrast-v4&quot;&gt;

&lt;style id=&quot;bulk-check-zebra-v6&quot;&gt;
/* ===== v6: zebra subsection headers + whole-section / whole-phase checkboxes ===== */

/* Stronger zebra separation for subsection / phase headers */
.sectionbody &gt; details.group:nth-of-type(odd) &gt; .grouphead,
.section-inner &gt; details.group:nth-of-type(odd) &gt; .group-head {
  background:#20242a !important;
}
.sectionbody &gt; details.group:nth-of-type(even) &gt; .grouphead,
.section-inner &gt; details.group:nth-of-type(even) &gt; .group-head {
  background:#2c3138 !important;
}

/* Main Quest phases get a subtle purple zebra identity instead of one flat purple look */
#content &gt; details.section:nth-of-type(4) .sectionbody &gt; details.group:nth-of-type(odd) &gt; .grouphead,
#content &gt; details.big-section:nth-of-type(4) .section-inner &gt; details.group:nth-of-type(odd) &gt; .group-head {
  background:#26202f !important;
}
#content &gt; details.section:nth-of-type(4) .sectionbody &gt; details.group:nth-of-type(even) &gt; .grouphead,
#content &gt; details.big-section:nth-of-type(4) .section-inner &gt; details.group:nth-of-type(even) &gt; .group-head {
  background:#342a40 !important;
}

/* Bulk check control used in top-level sections and subsection/phase headers */
.bulk-check-wrap {
  display:inline-flex;
  align-items:center;
  gap:7px;
  flex:0 0 auto;
  padding:6px 9px;
  border:1px solid #626b76;
  border-radius:8px;
  background:#101216;
  color:#e6ebef;
  font-size:11px;
  font-weight:900;
  letter-spacing:.04em;
  text-transform:uppercase;
  cursor:pointer;
  user-select:none;
}
.bulk-check-wrap:hover {
  background:#1b1f24;
  border-color:#89939e;
}
.bulk-check-wrap input {
  appearance:none;
  -webkit-appearance:none;
  width:19px;
  height:19px;
  margin:0;
  border:2px solid #89939e;
  border-radius:5px;
  background:#08090b;
  display:grid;
  place-content:center;
  cursor:pointer;
}
.bulk-check-wrap input::before {
  content:&quot;&quot;;
  width:10px;
  height:10px;
  transform:scale(0);
  transition:transform .08s ease-in-out;
  clip-path:polygon(14% 44%,0 59%,39% 100%,100% 18%,84% 3%,37% 70%);
  background:#08100b;
}
.bulk-check-wrap input:checked {
  background:#77dda3;
  border-color:#77dda3;
}
.bulk-check-wrap input:checked::before {
  transform:scale(1);
}
.bulk-check-wrap input:indeterminate {
  background:#f0b84b;
  border-color:#f0b84b;
}
.bulk-check-wrap input:indeterminate::before {
  transform:scale(1);
  clip-path:none;
  width:10px;
  height:3px;
  background:#17120a;
}
.bulk-check-wrap.complete {
  border-color:#5ca77a;
  background:#13261c;
  color:#bde9cd;
}
.bulk-check-wrap.partial {
  border-color:#997c35;
  background:#292313;
  color:#f3dda6;
}

/* Keep controls and chevrons visually separated */
.bulk-right {
  display:flex;
  align-items:center;
  gap:9px;
  flex:0 0 auto;
}

/* On narrow screens, do not let the header controls crush the title */
@media(max-width:720px){
  .bulk-check-wrap .bulk-label-text { display:none; }
  .bulk-check-wrap { padding:6px; }
  .bulk-right { gap:6px; }
}
&lt;/style&gt;

const sections = [{&quot;id&quot;: &quot;setup&quot;, &quot;number&quot;: &quot;1&quot;, &quot;title&quot;: &quot;Start Here — Map Setup&quot;, &quot;subtitle&quot;: &quot;Power → Pack-a-Punch → Low Gravity → Base Bow&quot;, &quot;kind&quot;: &quot;required&quot;, &quot;groups&quot;: [{&quot;title&quot;: &quot;1. Turn on Power&quot;, &quot;summary&quot;: &quot;Required before Pack-a-Punch, Death Ray quest functions, and several map systems.&quot;, &quot;steps&quot;: [{&quot;id&quot;: &quot;SET-01&quot;, &quot;title&quot;: &quot;Power Switch — Armory / Stamin-Up room&quot;, &quot;do&quot;: [&quot;Reach the Armory (the room with Stamin-Up) and flip the only Power Switch on the map.&quot;], &quot;look&quot;: &quot;The large lever panel shown here. Once it is on, the room and powered systems activate.&quot;, &quot;image&quot;: &quot;https://mmmrkennedy.com/games/BO3/der_eisendrache/pictures/power/power.webp&quot;, &quot;tag&quot;: &quot;required&quot;, &quot;warn&quot;: &quot;&quot;, &quot;note&quot;: &quot;&quot;, &quot;source&quot;: &quot;MMMR Kennedy&quot;, &quot;asset&quot;: &quot;assets/001_cf9de3c5a0.webp&quot;}]}, {&quot;title&quot;: &quot;2. Build Pack-a-Punch&quot;, &quot;summary&quot;: &quot;There are three PaP teleporter pieces. Interact with any two; Pack-a-Punch assembles at the third location.&quot;, &quot;steps&quot;: [{&quot;id&quot;: &quot;PAP-01&quot;, &quot;title&quot;: &quot;Pack-a-Punch piece — Bastion / Death Ray&quot;, &quot;do&quot;: [&quot;With Power on, interact with the PaP piece on the Bastion platform outside the Power room.&quot;], &quot;look&quot;: &quot;The PaP teleporter frame on the Death Ray platform.&quot;, &quot;image&quot;: &quot;https://mmmrkennedy.com/games/BO3/der_eisendrache/pictures/pap/pap_bastion.webp&quot;, &quot;tag&quot;: &quot;required&quot;, &quot;warn&quot;: &quot;&quot;, &quot;note&quot;: &quot;&quot;, &quot;source&quot;: &quot;MMMR Kennedy&quot;, &quot;asset&quot;: &quot;assets/002_93ba9c3810.webp&quot;}, {&quot;id&quot;: &quot;PAP-02&quot;, &quot;title&quot;: &quot;Pack-a-Punch piece — Undercroft&quot;, &quot;do&quot;: [&quot;Interact with the PaP piece at the back of the Undercroft, between the Juggernog side and Teleporter room.&quot;], &quot;look&quot;: &quot;The PaP teleporter frame against the stone wall.&quot;, &quot;image&quot;: &quot;https://mmmrkennedy.com/games/BO3/der_eisendrache/pictures/pap/pap_undercroft.webp&quot;, &quot;tag&quot;: &quot;required&quot;, &quot;warn&quot;: &quot;&quot;, &quot;note&quot;: &quot;&quot;, &quot;source&quot;: &quot;MMMR Kennedy&quot;, &quot;asset&quot;: &quot;assets/003_95989c2b60.webp&quot;}, {&quot;id&quot;: &quot;PAP-03&quot;, &quot;title&quot;: &quot;Pack-a-Punch piece — Rocket Test Pad&quot;, &quot;do&quot;: [&quot;Teleport to the Rocket Test Pad and interact with the PaP piece on the raised platform around the rocket.&quot;], &quot;look&quot;: &quot;The PaP teleporter frame on the elevated rocket platform.&quot;, &quot;image&quot;: &quot;https://mmmrkennedy.com/games/BO3/der_eisendrache/pictures/pap/pap_rocket_pad.webp&quot;, &quot;tag&quot;: &quot;required&quot;, &quot;warn&quot;: &quot;&quot;, &quot;note&quot;: &quot;&quot;, &quot;source&quot;: &quot;MMMR Kennedy&quot;, &quot;asset&quot;: &quot;assets/004_7473c584a0.webp&quot;}, {&quot;id&quot;: &quot;PAP-04&quot;, &quot;title&quot;: &quot;Pack-a-Punch is now active&quot;, &quot;do&quot;: [&quot;After you interact with the second piece, Pack-a-Punch forms at the remaining third location.&quot;, &quot;Later it can move among these three spots every few rounds.&quot;], &quot;look&quot;: &quot;Use the lit Pack-a-Punch indicator sign to tell which of the three PaP locations is currently active.&quot;, &quot;image&quot;: &quot;https://mmmrkennedy.com/games/BO3/der_eisendrache/pictures/pap/pap_indicator.webp&quot;, &quot;tag&quot;: &quot;required&quot;, &quot;warn&quot;: &quot;&quot;, &quot;note&quot;: &quot;Pack-a-Punch forms at the third location after you teleport the first two pieces. Later it can move among the three locations.&quot;, &quot;source&quot;: &quot;MMMR Kennedy&quot;, &quot;asset&quot;: &quot;assets/005_dbd867f6db.webp&quot;}]}, {&quot;title&quot;: &quot;3. Activate Undercroft Low Gravity&quot;, &quot;summary&quot;: &quot;Needed for the Shield Window part and parts of the Storm and Wolf bow quests.&quot;, &quot;steps&quot;: [{&quot;id&quot;: &quot;LOW-01&quot;, &quot;title&quot;: &quot;Stand on all 4 Pyramid floor plates&quot;, &quot;do&quot;: [&quot;Stand on each of the four square floor plates surrounding the Pyramid for about 3 seconds.&quot;], &quot;look&quot;: &quot;Each plate begins glowing after it is activated.&quot;, &quot;image&quot;: &quot;https://mmmrkennedy.com/games/BO3/der_eisendrache/pictures/undercroft_low_gravity/platform.webp&quot;, &quot;tag&quot;: &quot;required&quot;, &quot;warn&quot;: &quot;&quot;, &quot;note&quot;: &quot;&quot;, &quot;source&quot;: &quot;MMMR Kennedy&quot;, &quot;asset&quot;: &quot;assets/006_900a357899.webp&quot;}, {&quot;id&quot;: &quot;LOW-02&quot;, &quot;title&quot;: &quot;Confirm all 4 plates are glowing&quot;, &quot;do&quot;: [&quot;Activate all four plates.&quot;, &quot;Low gravity then cycles on, letting you jump higher and wall-run.&quot;], &quot;look&quot;: &quot;The plates and room light up during the low-gravity state.&quot;, &quot;image&quot;: &quot;https://mmmrkennedy.com/games/BO3/der_eisendrache/pictures/undercroft_low_gravity/glowing_platform.webp&quot;, &quot;tag&quot;: &quot;required&quot;, &quot;warn&quot;: &quot;&quot;, &quot;note&quot;: &quot;MMMR Kennedy documents ~50 seconds of low gravity followed by about a 60-second reactivation cycle.&quot;, &quot;source&quot;: &quot;MMMR Kennedy&quot;, &quot;asset&quot;: &quot;assets/007_66b1718257.webp&quot;}]}, {&quot;title&quot;: &quot;4. Get the Base Bow — Wrath of the Ancients&quot;, &quot;summary&quot;: &quot;Feed 8 zombies to each dragon. Wait for each eating animation to finish before killing the next zombie.&quot;, &q nd check the base of the small staircase.&quot;], &quot;look&quot;: &quot;The Rockets part at the bottom of the small stairs.&quot;, &quot;image&quot;: &quot;https://mmmrkennedy.com/games/BO3/der_eisendrache/pictures/rocket_shield/rockets_stairs.webp&quot;, &quot;tag&quot;: &quot;buildable&quot;, &quot;warn&quot;: &quot;&quot;, &quot;note&quot;: &quot;&quot;, &quot;source&quot;: &quot;MMMR Kennedy&quot;, &quot;asset&quot;: &quot;assets/013_3f63501582.webp&quot;}, {&quot;id&quot;: &quot;SH-R3&quot;, &quot;title&quot;: &quot;Rockets spawn C — stairs toward Death Ray&quot;, &quot;do&quot;: [&quot;Check the upper stairs leading toward the Death Ray / Power-door side.&quot;], &quot;look&quot;: &quot;The Rockets part beside the stone wall near the stair route.&quot;, &quot;image&quot;: &quot;https://mmmrkennedy.com/games/BO3/der_eisendrache/pictures/rocket_shield/rockets_death_ray.webp&quot;, &quot;tag&quot;: &quot;buildable&quot;, &quot;warn&quot;: &quot;&quot;, &quot;note&quot;: &quot;&quot;, &quot;source&quot;: &quot;MMMR Kennedy&quot;, &quot;asset&quot;: &quot;assets/014_19cd4e18e8.webp&quot;}]}, {&quot;title&quot;: &quot;Rocket Shield — Part 2: Base&quot;, &quot;summary&quot;: &quot;The Base part spawns in ONE of these 3 Clock Tower / Upper Courtyard locations.&quot;, &quot;steps&quot;: [{&quot;id&quot;: &quot;SH-B1&quot;, &quot;title&quot;: &quot;Base spawn A — Clock Tower desk&quot;, &quot;do&quot;: [&quot;Enter the Clock Tower and check the desk opposite the entrance.&quot;], &quot;look&quot;: &quot;The shield Base leaning beside the desk.&quot;, &quot;image&quot;: &quot;https://mmmrkennedy.com/games/BO3/der_eisendrache/pictures/rocket_shield/base_clocktower.webp&quot;, &quot;tag&quot;: &quot;buildable&quot;, &quot;warn&quot;: &quot;&quot;, &quot;note&quot;: &quot;&quot;, &quot;source&quot;: &quot;MMMR Kennedy&quot;, &quot;asset&quot;: &quot;assets/015_ce8f75f034.webp&quot;}, {&quot;id&quot;: &quot;SH-B2&quot;, &quot;title&quot;: &quot;Base spawn B — Wunderfizz st &lt;script id=&quot;image-lightbox-script-v5&quot;&gt;
(function(){
  function initImageLightbox(){
    if(document.getElementById(&#x27;imageLightbox&#x27;)) return;

    const wrap = document.createElement(&#x27;div&#x27;);
    wrap.innerHTML = `
&lt;div id=&quot;imageLightbox&quot; class=&quot;image-lightbox&quot; aria-hidden=&quot;true&quot;&gt;
  &lt;button id=&quot;imageLightboxClose&quot; class=&quot;image-lightbox-close&quot; type=&quot;button&quot; aria-label=&quot;Close enlarged image&quot;&gt;×&lt;/button&gt;
  &lt;div class=&quot;image-lightbox-inner&quot;&gt;
    &lt;img id=&quot;imageLightboxImg&quot; class=&quot;image-lightbox-img&quot; alt=&quot;Expanded guide image&quot;&gt;
  &lt;/div&gt;
  &lt;div class=&quot;image-lightbox-hint&quot;&gt;Click image/background or press Esc to close&lt;/div&gt;
&lt;/div&gt;
`;
    const lightbox = wrap.firstElementChild;
    document.body.appendChild(lightbox);

    const big = document.getElementById(&#x27;imageLightboxImg&#x27;);
    const close = document.getElementById(&#x27;imageLightboxClose&#x27;);

    function openLightbox(img){
      const src = img.currentSrc || img.src || img.dataset.remote;
      if(!src) return;
      big.src = src;
      big.alt = img.alt || &#x27;Expanded guide image&#x27;;
      lightbox.classList.add(&#x27;open&#x27;);
      lightbox.setAttribute(&#x27;aria-hidden&#x27;,&#x27;false&#x27;);
      document.body.classList.add(&#x27;lightbox-open&#x27;);
    }

    function closeLightbox(){
      lightbox.classList.remove(&#x27;open&#x27;);
      lightbox.setAttribute(&#x27;aria-hidden&#x27;,&#x27;true&#x27;);
      document.body.classList.remove(&#x27;lightbox-open&#x27;);
      big.removeAttribute(&#x27;src&#x27;);
    }

    document.addEventListener(&#x27;click&#x27;, function(e){
      const holder = e.target.closest(&#x27;.img, .imgwrap&#x27;);
      if(holder){
        const img = holder.querySelector(&#x27;img&#x27;);
        if(img){
          e.preventDefault();
          e.stopPropagation();
          openLightbox(img);
          return;
        }
      }
    }, true);

    close.addEventListener(&#x27;click&#x27;, function(e){
      e.stopPropagation();
      closeLightbox();
    });

    lightbox.addEventListener(&#x27;click&#x27;, function(e){
      if(e.target === lightbox || e.target === big || e.target.classList.contains(&#x27;image-lightbox-inner&#x27;)){
        closeLightbox();
      }
    });

    document.addEventListener(&#x27;keydown&#x27;, function(e){
      if(e.key === &#x27;Escape&#x27; &amp;&amp; lightbox.classList.contains(&#x27;open&#x27;)) closeLightbox();
    });
  }

  if(document.readyState === &#x27;loading&#x27;){
    document.addEventListener(&#x27;DOMContentLoaded&#x27;, initImageLightbox);
  } else {
    initImageLightbox();
  }
})();
&lt;/script&gt;


&lt;script id=&quot;bulk-check-zebra-script-v6&quot;&gt;
(function(){
  function stopSummaryToggle(el){
    [&#x27;click&#x27;,&#x27;mousedown&#x27;,&#x27;pointerdown&#x27;,&#x27;touchstart&#x27;].forEach(function(evt){
      el.addEventListener(evt,function(e){ e.stopPropagation(); }, {passive:false});
    });
  }

  function makeBulkControl(kind){
    const label=document.createElement(&#x27;label&#x27;);
    label.className=&#x27;bulk-check-wrap&#x27;;
    label.title=kind===&#x27;section&#x27; ? &#x27;Mark every step in this entire section&#x27; : &#x27;Mark every step in this phase / subsection&#x27;;

    const cb=document.createElement(&#x27;input&#x27;);
    cb.type=&#x27;checkbox&#x27;;
    cb.className=&#x27;bulk-check&#x27;;
    cb.setAttribute(&#x27;aria-label&#x27;, kind===&#x27;section&#x27; ? &#x27;Mark entire section complete&#x27; : &#x27;Mark entire phase complete&#x27;);

    const text=document.createElement(&#x27;span&#x27;);
    text.className=&#x27;bulk-label-text&#x27;;
    text.textContent=kind===&#x27;section&#x27; ? &#x27;Section&#x27; : &#x27;Phase&#x27;;

    label.appendChild(cb);
    label.appendChild(text);
    stopSummaryToggle(label);
    return {label,cb};
  }

  function childStepBoxes(container){
    return Array.from(container.querySelectorAll(&#x27;.cb&#x27;));
  }

  function syncOne(control, boxes){
    const total=boxes.length;
    const checked=boxes.filter(x=&gt;x.checked).length;

    control.checked = total&gt;0 &amp;&amp; checked===total;
    control.indeterminate = checked&gt;0 &amp;&amp; checked&lt;total;

    const wrap=control.closest(&#x27;.bulk-check-wrap&#x27;);
    if(wrap){
      wrap.classList.toggle(&#x27;complete&#x27;, total&gt;0 &amp;&amp; checked===total);
      wrap.classList.toggle(&#x27;partial&#x27;, checked&gt;0 &amp;&amp; checked&lt;total);
    }
  }

  function syncBulkChecks(){
    document.querySelectorAll(&#x27;details.group&#x27;).forEach(function(group){
      const cb=group.querySelector(&#x27;:scope &gt; summary .bulk-check&#x27;);
      if(cb) syncOne(cb, childStepBoxes(group));
    });

    document.querySelectorAll(&#x27;details.section, details.big-section&#x27;).forEach(function(section){
      const cb=section.querySelector(&#x27;:scope &gt; summary .bulk-check&#x27;);
      if(cb) syncOne(cb, childStepBoxes(section));
    });
  }

  function persistAfterBulk(boxes){
    if(!boxes.length) return;
    // Existing guide listeners save ALL step states whenever one normal step checkbox changes.
    boxes[0].dispatchEvent(new Event(&#x27;change&#x27;,{bubbles:true}));
    setTimeout(syncBulkChecks,0);
  }

  function initBulkChecks(){
    if(document.documentElement.dataset.bulkChecksV6===&#x27;1&#x27;){
      syncBulkChecks();
      return;
    }
    document.documentElement.dataset.bulkChecksV6=&#x27;1&#x27;;

    /* Subsections / phases */
    document.querySelectorAll(&#x27;details.group&#x27;).forEach(function(group){
      const summary=group.querySelector(&#x27;:scope &gt; summary&#x27;);
      if(!summary || summary.querySelector(&#x27;.bulk-check-wrap&#x27;)) return;

      const made=makeBulkControl(&#x27;phase&#x27;);
      const chevron=summary.querySelector(&#x27;.chev&#x27;);

      const right=document.createElement(&#x27;div&#x27;);
      right.className=&#x27;bulk-right&#x27;;
      right.appendChild(made.label);
      if(chevron){
        chevron.parentNode.removeChild(chevron);
        right.appendChild(chevron);
      }
      summary.appendChild(right);

      made.cb.addEventListener(&#x27;change&#x27;,function(e){
        e.stopPropagation();
        const boxes=childStepBoxes(group);
        boxes.forEach(function(box){ box.checked=made.cb.checked; });
        persistAfterBulk(boxes);
      });
    });

    /* Top-level sections */
    document.querySelectorAll(&#x27;details.section, details.big-section&#x27;).forEach(function(section){
      const summary=section.querySelector(&#x27;:scope &gt; summary&#x27;);
      if(!summary || summary.querySelector(&#x27;.bulk-check-wrap&#x27;)) return;

      const made=makeBulkControl(&#x27;section&#x27;);

      // Der Eisendrache already has a right-side wrapper containing count + chevron.
      let existingRight=null;
      Array.from(summary.children).forEach(function(child){
        if(child.querySelector &amp;&amp; (child.querySelector(&#x27;.section-count&#x27;) || child.querySelector(&#x27;.chev&#x27;))){
          if(child !== summary.firstElementChild) existingRight=child;
        }
      });

      if(existingRight){
        existingRight.classList.add(&#x27;bulk-right&#x27;);
        existingRight.insertBefore(made.label, existingRight.firstChild);
      } else {
        const chevron=summary.querySelector(&#x27;:scope &gt; .chev&#x27;);
        const right=document.createElement(&#x27;div&#x27;);
        right.className=&#x27;bulk-right&#x27;;
        right.appendChild(made.label);
        if(chevron){
          chevron.parentNode.removeChild(chevron);
          right.appendChild(chevron);
        }
        summary.appendChild(right);
      }

      made.cb.addEventListener(&#x27;change&#x27;,function(e){
        e.stopPropagation();
        const boxes=childStepBoxes(section);
        boxes.forEach(function(box){ box.checked=made.cb.checked; });
        persistAfterBulk(boxes);
      });
    });

    document.addEventListener(&#x27;change&#x27;,function(e){
      if(e.target &amp;&amp; e.target.classList &amp;&amp; e.target.classList.contains(&#x27;cb&#x27;)){
        setTimeout(syncBulkChecks,0);
      }
    });

    syncBulkChecks();
  }

  if(document.readyState===&#x27;loading&#x27;){
    document.addEventListener(&#x27;DOMContentLoaded&#x27;,initBulkChecks);
  }else{
    initBulkChecks();
  }

  // Existing guide render functions finish synchronously, but this second pass makes the
  // enhancement resilient if a browser delays inline script execution.
  setTimeout(initBulkChecks,50);
})();
&lt;/script&gt;
